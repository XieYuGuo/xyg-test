<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 表格可视化工具</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23667eea'/%3E%3Cstop offset='100%25' stop-color='%23764ba2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Crect x='6' y='8' width='20' height='4' rx='1' fill='white' opacity='0.9'/%3E%3Crect x='6' y='14' width='20' height='4' rx='1' fill='white' opacity='0.7'/%3E%3Crect x='6' y='20' width='20' height='4' rx='1' fill='white' opacity='0.5'/%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-primary: #f5f7fa;
            --bg-card: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --border-color: #e4e7ed;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-color: #667eea;
            --primary-hover: #5568d3;
            --success-color: #67c23a;
            --danger-color: #f56c6c;
        }
        
        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-card: #16213e;
            --text-primary: #eaeaea;
            --text-secondary: #a0a0a0;
            --border-color: #2a2a4a;
            --shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        [data-theme="dark"] ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        
        [data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: #3a3a5a;
        }
        
        [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
            background: #4a4a6a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 16px 24px;
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--primary-gradient);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .btn-secondary:hover {
            background: var(--border-color);
        }
        
        .btn-success {
            background: var(--success-color);
            color: white;
        }
        
        .btn-success:hover {
            opacity: 0.9;
        }
        
        /* Input Section */
        .input-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        
        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .input-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .input-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .json-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .json-actions {
            display: flex;
            gap: 8px;
        }
        
        .json-textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.3s;
        }
        
        .json-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .control-item {
            width: 100%;
        }
        
        .control-item label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        
        .control-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.3s;
        }
        
        .control-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .control-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
        }
        
        .hint-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        /* Table Section */
        .table-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            flex: 1;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            overflow: visible;
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .table-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .table-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        /* Column Settings Dropdown */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 8px;
            background: var(--bg-card);
            min-width: 280px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            z-index: 1000;
            padding: 12px;
        }
        
        .dropdown-content.show {
            display: block;
        }
        
        .dropdown-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        
        .column-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .column-item:hover {
            background: var(--bg-primary);
        }
        
        .column-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }
        
        .column-item label {
            flex: 1;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-primary);
        }
        
        .dropdown-footer {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        
        /* Table Container */
        .table-container {
            flex: 1;
            min-height: 300px;
            overflow: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .data-table th {
            background: var(--bg-primary);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        
        .data-table tr:hover {
            background: var(--bg-primary);
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .empty-text {
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .empty-hint {
            font-size: 13px;
            opacity: 0.7;
        }
        
        /* Fullscreen */
        .fullscreen-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            z-index: 9999;
            padding: 20px;
            display: none;
            flex-direction: column;
        }
        
        .fullscreen-container.active {
            display: flex;
        }
        
        .fullscreen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 16px 24px;
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }
        
        .fullscreen-content {
            flex: 1;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .fullscreen-table-container {
            flex: 1;
            overflow: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        
        /* Message */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 13px;
            display: none;
        }
        
        .message.error {
            background: #fef0f0;
            color: var(--danger-color);
            border: 1px solid #fde2e2;
            display: block;
        }
        
        .message.success {
            background: #f0f9ff;
            color: var(--primary-color);
            border: 1px solid #d9ecff;
            display: block;
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .json-label-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .json-actions {
                width: 100%;
                justify-content: flex-end;
            }
            
            .table-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>JSON 表格可视化工具</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="toggleTheme()">
                    <span id="themeIcon">☀️</span>
                    <span id="themeText">浅色模式</span>
                </button>
            </div>
        </div>
        
        <!-- Input Section -->
        <div class="input-section">
            <div class="input-header">
                <h2>数据输入与配置</h2>
            </div>
            
            <div class="input-content">
                <div class="json-label-row">
                    <label style="font-size: 14px; font-weight: 500; color: var(--text-secondary);">JSON 数据</label>
                    <div class="json-actions">
                        <button class="btn btn-secondary" onclick="formatJSON()" title="格式化JSON">
                            <span>📝</span>
                            <span>格式化</span>
                        </button>
                        <button class="btn btn-secondary" onclick="compressJSON()" title="压缩JSON">
                            <span>🗜️</span>
                            <span>压缩</span>
                        </button>
                    </div>
                </div>
                <textarea class="json-textarea" id="jsonInput" placeholder="请粘贴 JSON 数据，支持对象数组格式...&#10;&#10;示例：&#10;[&#10;  {&quot;name&quot;: &quot;张三&quot;, &quot;age&quot;: 28, &quot;city&quot;: &quot;北京&quot;},&#10;  {&quot;name&quot;: &quot;李四&quot;, &quot;age&quot;: 32, &quot;city&quot;: &quot;上海&quot;}&#10;]"></textarea>
                <div class="message" id="inputMessage"></div>
                
                <div class="control-item">
                    <label>默认显示字段</label>
                    <input type="text" class="control-input" id="defaultFields" placeholder="字段1, 字段2, 字段3">
                    <div class="hint-text">多个字段用逗号分隔,留空则显示全部</div>
                </div>
                
                <div class="control-item">
                    <label>表格标题</label>
                    <input type="text" class="control-input" id="tableTitle" placeholder="数据表格">
                </div>
                
                <div class="control-actions">
                    <button class="btn btn-primary" onclick="parseJSON()">
                        <span>📊</span>
                        <span>解析数据</span>
                    </button>
                    <button class="btn btn-secondary" onclick="clearInput()">
                        <span>🗑️</span>
                        <span>清空</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Table Section -->
        <div class="table-section" id="tableSection">
            <div class="table-header">
                <h2 id="tableHeaderTitle">数据表格</h2>
                <div class="table-actions">
                    <div class="dropdown">
                        <button class="btn btn-secondary" onclick="toggleDropdown()">
                            <span>⚙️</span>
                            <span>列设置</span>
                        </button>
                        <div class="dropdown-content" id="columnDropdown">
                            <div class="dropdown-header">选择要显示的列</div>
                            <div id="columnList"></div>
                            <div class="dropdown-footer">
                                <button class="btn btn-secondary" onclick="selectAllColumns()" style="padding: 6px 12px; font-size: 12px;">全选</button>
                                <button class="btn btn-secondary" onclick="deselectAllColumns()" style="padding: 6px 12px; font-size: 12px;">全不选</button>
                            </div>
                        </div>
                    </div>
                    
                    <button class="btn btn-secondary" onclick="refreshColumns()">
                        <span>🔄</span>
                        <span>刷新</span>
                    </button>
                    
                    <button class="btn btn-success" onclick="exportToExcel()">
                        <span>📥</span>
                        <span>导出Excel</span>
                    </button>
                    
                    <button class="btn btn-secondary" onclick="toggleFullscreen()">
                        <span>⛶</span>
                        <span>全屏</span>
                    </button>
                </div>
            </div>
            
            <div class="table-container" id="tableContainer">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📋</div>
                    <div class="empty-text">暂无数据</div>
                    <div class="empty-hint">请在上方粘贴 JSON 数据并点击"解析数据"按钮</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Fullscreen Container -->
    <div class="fullscreen-container" id="fullscreenContainer">
        <div class="fullscreen-header">
            <h1 id="fullscreenTitle">数据表格</h1>
            <div class="table-actions">
                <div class="dropdown">
                    <button class="btn btn-secondary" onclick="toggleDropdownFullscreen()">
                        <span>⚙️</span>
                        <span>列设置</span>
                    </button>
                    <div class="dropdown-content" id="columnDropdownFullscreen">
                        <div class="dropdown-header">选择要显示的列</div>
                        <div id="columnListFullscreen"></div>
                        <div class="dropdown-footer">
                            <button class="btn btn-secondary" onclick="selectAllColumnsFullscreen()" style="padding: 6px 12px; font-size: 12px;">全选</button>
                            <button class="btn btn-secondary" onclick="deselectAllColumnsFullscreen()" style="padding: 6px 12px; font-size: 12px;">全不选</button>
                        </div>
                    </div>
                </div>
                
                <button class="btn btn-secondary" onclick="refreshColumnsFullscreen()">
                    <span>🔄</span>
                    <span>刷新</span>
                </button>
                
                <button class="btn btn-success" onclick="exportToExcel()">
                    <span>📥</span>
                    <span>导出Excel</span>
                </button>
                
                <button class="btn btn-secondary" onclick="closeFullscreen()">
                    <span>✕</span>
                    <span>退出全屏</span>
                </button>
            </div>
        </div>
        
        <div class="fullscreen-content">
            <div class="fullscreen-table-container" id="fullscreenTableContainer">
                <div class="empty-state">
                    <div class="empty-icon">📋</div>
                    <div class="empty-text">暂无数据</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // State
        let jsonData = [];
        let allColumns = [];
        let visibleColumns = [];
        let defaultColumns = [];
        
        // Theme Toggle
        function toggleTheme() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            
            if (isDark) {
                body.removeAttribute('data-theme');
                document.getElementById('themeIcon').textContent = '🌙';
                document.getElementById('themeText').textContent = '深色模式';
            } else {
                body.setAttribute('data-theme', 'dark');
                document.getElementById('themeIcon').textContent = '☀️';
                document.getElementById('themeText').textContent = '浅色模式';
            }
        }
        
        // Parse JSON
        function parseJSON() {
            const input = document.getElementById('jsonInput').value.trim();
            const messageEl = document.getElementById('inputMessage');
            
            if (!input) {
                showMessage('请输入 JSON 数据', 'error');
                return;
            }
            
            try {
                const parsed = JSON.parse(input);
                
                if (Array.isArray(parsed)) {
                    jsonData = parsed;
                } else if (typeof parsed === 'object' && parsed !== null) {
                    jsonData = [parsed];
                } else {
                    throw new Error('JSON 格式不正确');
                }
                
                if (jsonData.length === 0) {
                    showMessage('JSON 数据为空', 'error');
                    return;
                }
                
                // Extract columns
                allColumns = [...new Set(jsonData.flatMap(item => Object.keys(item)))];
                
                // Get default fields
                const defaultFieldsInput = document.getElementById('defaultFields').value.trim();
                if (defaultFieldsInput) {
                    const specifiedFields = defaultFieldsInput.split(',').map(f => f.trim()).filter(f => allColumns.includes(f));
                    // 按照allColumns的顺序重新排列
                    defaultColumns = allColumns.filter(col => specifiedFields.includes(col));
                    visibleColumns = [...defaultColumns];
                } else {
                    defaultColumns = [...allColumns];
                    visibleColumns = [...allColumns];
                }
                
                // Update table title
                const tableTitle = document.getElementById('tableTitle').value.trim() || '数据表格';
                document.getElementById('tableHeaderTitle').textContent = tableTitle;
                document.getElementById('fullscreenTitle').textContent = tableTitle;
                
                // Render
                renderColumnList();
                renderTable();
                
                showMessage(`成功解析 ${jsonData.length} 条数据`, 'success');
                
                // Auto hide message
                setTimeout(() => {
                    messageEl.style.display = 'none';
                }, 3000);
                
            } catch (error) {
                showMessage(`解析失败: ${error.message}`, 'error');
            }
        }
        
        function showMessage(text, type) {
            const messageEl = document.getElementById('inputMessage');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
        }
        
        function clearInput() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('defaultFields').value = '';
            document.getElementById('tableTitle').value = '';
            document.getElementById('inputMessage').style.display = 'none';
        }
        
        // JSON Format & Compress
        function formatJSON() {
            const input = document.getElementById('jsonInput').value.trim();
            if (!input) {
                showMessage('请输入 JSON 数据', 'error');
                return;
            }
            
            try {
                const parsed = JSON.parse(input);
                const formatted = JSON.stringify(parsed, null, 2);
                document.getElementById('jsonInput').value = formatted;
                showMessage('JSON 格式化成功', 'success');
                setTimeout(() => {
                    document.getElementById('inputMessage').style.display = 'none';
                }, 2000);
            } catch (error) {
                showMessage(`格式化失败: ${error.message}`, 'error');
            }
        }
        
        function compressJSON() {
            const input = document.getElementById('jsonInput').value.trim();
            if (!input) {
                showMessage('请输入 JSON 数据', 'error');
                return;
            }
            
            try {
                const parsed = JSON.parse(input);
                const compressed = JSON.stringify(parsed);
                document.getElementById('jsonInput').value = compressed;
                showMessage('JSON 压缩成功', 'success');
                setTimeout(() => {
                    document.getElementById('inputMessage').style.display = 'none';
                }, 2000);
            } catch (error) {
                showMessage(`压缩失败: ${error.message}`, 'error');
            }
        }
        
        // Column Management
        function renderColumnList() {
            const columnList = document.getElementById('columnList');
            const columnListFullscreen = document.getElementById('columnListFullscreen');
            
            const html = allColumns.map(col => `
                <div class="column-item">
                    <input type="checkbox" id="col-${col}" ${visibleColumns.includes(col) ? 'checked' : ''} onchange="toggleColumn('${col}')">
                    <label for="col-${col}">${col}</label>
                </div>
            `).join('');
            
            columnList.innerHTML = html;
            columnListFullscreen.innerHTML = html;
        }
        
        function toggleColumn(column) {
            const index = visibleColumns.indexOf(column);
            if (index > -1) {
                // 取消勾选：从visibleColumns中移除
                visibleColumns.splice(index, 1);
            } else {
                // 勾选：按照allColumns的顺序插入到正确位置
                const insertIndex = allColumns.findIndex(col => visibleColumns.includes(col) && allColumns.indexOf(col) > allColumns.indexOf(column));
                if (insertIndex === -1) {
                    // 如果没有找到合适的插入位置，追加到末尾
                    visibleColumns.push(column);
                } else {
                    // 按照allColumns的顺序排序所有字段
                    visibleColumns = allColumns.filter(col => visibleColumns.includes(col) || col === column);
                }
            }
            renderColumnList();
            renderTable();
        }
        
        function toggleDropdown() {
            const dropdown = document.getElementById('columnDropdown');
            dropdown.classList.toggle('show');
        }
        
        function toggleDropdownFullscreen() {
            const dropdown = document.getElementById('columnDropdownFullscreen');
            dropdown.classList.toggle('show');
        }
        
        function selectAllColumns() {
            visibleColumns = [...allColumns];
            renderColumnList();
            renderTable();
        }
        
        function deselectAllColumns() {
            visibleColumns = [];
            renderColumnList();
            renderTable();
        }
        
        function selectAllColumnsFullscreen() {
            selectAllColumns();
        }
        
        function deselectAllColumnsFullscreen() {
            deselectAllColumns();
        }
        
        function refreshColumns() {
            visibleColumns = [...defaultColumns];
            renderColumnList();
            renderTable();
        }
        
        function refreshColumnsFullscreen() {
            refreshColumns();
        }
        
        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown')) {
                document.getElementById('columnDropdown').classList.remove('show');
                document.getElementById('columnDropdownFullscreen').classList.remove('show');
            }
        });
        
        // Table Rendering
        function renderTable() {
            const container = document.getElementById('tableContainer');
            const fullscreenContainer = document.getElementById('fullscreenTableContainer');
            
            if (visibleColumns.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-text">未选择任何列</div>
                        <div class="empty-hint">请在列设置中选择要显示的字段</div>
                    </div>
                `;
                fullscreenContainer.innerHTML = container.innerHTML;
                return;
            }
            
            const tableHTML = `
                <table class="data-table">
                    <thead>
                        <tr>
                            ${visibleColumns.map(col => `<th>${col}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        ${jsonData.map(row => `
                            <tr>
                                ${visibleColumns.map(col => `<td>${formatValue(row[col])}</td>`).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            container.innerHTML = tableHTML;
            fullscreenContainer.innerHTML = tableHTML;
        }
        
        function formatValue(value) {
            if (value === null || value === undefined) return '';
            if (typeof value === 'object') return JSON.stringify(value);
            return String(value);
        }
        
        // Export to Excel
        function exportToExcel() {
            if (jsonData.length === 0 || visibleColumns.length === 0) {
                alert('没有可导出的数据');
                return;
            }
            
            const exportData = jsonData.map(row => {
                const obj = {};
                visibleColumns.forEach(col => {
                    obj[col] = formatValue(row[col]);
                });
                return obj;
            });
            
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '数据');
            
            // Set column widths
            const colWidths = visibleColumns.map(col => ({
                wch: Math.max(col.length, ...exportData.map(row => String(row[col] || '').length))
            }));
            ws['!cols'] = colWidths;
            
            const tableTitle = document.getElementById('tableHeaderTitle').textContent;
            XLSX.writeFile(wb, `${tableTitle}.xlsx`);
        }
        
        // Fullscreen
        function toggleFullscreen() {
            document.getElementById('fullscreenContainer').classList.add('active');
        }
        
        function closeFullscreen() {
            document.getElementById('fullscreenContainer').classList.remove('active');
        }
        
        // Escape key to exit fullscreen
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeFullscreen();
            }
        });
    </script>
</body>
</html>
