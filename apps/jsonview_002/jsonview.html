    <script>
        // ===== State =====
        let jsonData = [];
        let columnSchema = [];
        let visiblePaths = new Set();
        let defaultPaths = [];
        let rawParsedData = null;
        let schemaNodeIndex = 0;
        let currentViewMode = 'horizontal'; // 'horizontal' or 'vertical'
        let expandOverrides = new Map(); // id -> true(expanded) / false(collapsed)

        function safeId(str) {
            return String(str).replace(/[^a-zA-Z0-9_]/g, '_');
        }

        function restoreExpandState() {
            expandOverrides.forEach(function(expanded, id) {
                var content = document.getElementById('content_' + id);
                var icon = document.getElementById('icon_' + id);
                if (content) {
                    if (expanded) {
                        content.classList.remove('collapsed-content');
                    } else {
                        content.classList.add('collapsed-content');
                    }
                }
                if (icon) {
                    if (expanded) {
                        icon.classList.remove('collapsed');
                    } else {
                        icon.classList.add('collapsed');
                    }
                }
            });
        }

        // ===== Theme Toggle =====
        function toggleTheme() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            if (isDark) {
                body.removeAttribute('data-theme');
                document.getElementById('themeIcon').textContent = '🌙';
                document.getElementById('themeText').textContent = '深色模式';
            } else {
                body.setAttribute('data-theme', 'dark');
                document.getElementById('themeIcon').textContent = '☀️';
                document.getElementById('themeText').textContent = '浅色模式';
            }
        }

        // ===== JSON Parse =====
        function parseJSON() {
            const input = document.getElementById('jsonInput').value.trim();
            const messageEl = document.getElementById('inputMessage');

            if (!input) { showMessage('请输入 JSON 数据', 'error'); return; }

            try {
                const parsed = JSON.parse(input);
                rawParsedData = parsed;

                if (Array.isArray(parsed)) {
                    jsonData = parsed;
                } else if (typeof parsed === 'object' && parsed !== null) {
                    jsonData = [parsed];
                } else {
                    throw new Error('JSON 格式不正确');
                }

                if (jsonData.length === 0) { showMessage('JSON 数据为空', 'error'); return; }

                // Build column schema
                schemaNodeIndex = 0;
                columnSchema = buildColumnSchema(jsonData);

                const allPaths = getAllPaths(columnSchema);
                const hasNested = allPaths.some(p => p.includes('.') || p.includes('['));

                // Get default fields
                const defaultFieldsInput = document.getElementById('defaultFields').value.trim();
                if (defaultFieldsInput) {
                    const specifiedPaths = defaultFieldsInput.split(',').map(f => f.trim()).filter(f => f);
                    visiblePaths = new Set();
                    specifiedPaths.forEach(sp => {
                        if (allPaths.includes(sp)) {
                            const node = findNodeByPath(columnSchema, sp);
                            if (node) getAllPaths([node]).forEach(p => visiblePaths.add(p));
                        }
                    });
                } else {
                    visiblePaths = new Set(allPaths);
                    document.getElementById('defaultFields').value = allPaths.join(', ');
                }

                defaultPaths = [...visiblePaths];
                updateSchemaVisibility(columnSchema);
                ensureParentVisibility(columnSchema);

                // Update table title
                const tableTitle = document.getElementById('tableTitle').value.trim() || '数据表格';
                document.getElementById('tableHeaderTitle').textContent = tableTitle;
                document.getElementById('fullscreenTitle').textContent = tableTitle;

                // Update data count
                const countText = `${jsonData.length} 条`;
                document.getElementById('dataCount').textContent = countText;
                document.getElementById('dataCountFullscreen').textContent = countText;

                renderTreeColumnSettings();
                renderView();
                updateViewToggleVisibility();

                showMessage(`成功解析 ${jsonData.length} 条数据${hasNested ? '（检测到嵌套结构）' : ''}`, 'success');
                setTimeout(() => { messageEl.style.display = 'none'; }, 3000);
            } catch (error) {
                showMessage(`解析失败: ${error.message}`, 'error');
            }
        }

        // ===== Schema Building =====
        function buildColumnSchema(data) {
            if (Array.isArray(data)) {
                if (data.length > 0 && data.every(item => item !== null && typeof item === 'object' && !Array.isArray(item))) {
                    const merged = deepMergeObjects(data);
                    return buildObjectChildren(merged, '');
                }
                return [];
            }
            if (typeof data === 'object' && data !== null) {
                return buildObjectChildren(data, '');
            }
            return [];
        }

        function deepMergeObjects(objects) {
            const result = {};
            for (const obj of objects) {
                if (!obj || typeof obj !== 'object' || Array.isArray(obj)) continue;
                for (const key of Object.keys(obj)) {
                    if (result[key] === undefined) {
                        result[key] = obj[key];
                    } else if (result[key] !== null && obj[key] !== null &&
                               typeof result[key] === 'object' && typeof obj[key] === 'object') {
                        if (Array.isArray(result[key]) && Array.isArray(obj[key])) {
                            result[key] = [...result[key], ...obj[key]];
                        } else if (!Array.isArray(result[key]) && !Array.isArray(obj[key])) {
                            result[key] = deepMergeObjects([result[key], obj[key]]);
                        }
                    }
                }
            }
            return result;
        }

        function buildObjectChildren(obj, parentPath) {
            return Object.keys(obj).map(key => {
                const val = obj[key];
                const path = parentPath ? `${parentPath}.${key}` : key;
                const idx = schemaNodeIndex++;

                if (val === null || val === undefined || typeof val !== 'object') {
                    return { path, label: key, type: 'primitive', children: [], visible: true, extractPath: path, idx };
                }

                if (Array.isArray(val)) {
                    const allObj = val.length > 0 && val.every(item => item !== null && typeof item === 'object' && !Array.isArray(item));
                    if (allObj) {
                        const merged = deepMergeObjects(val);
                        const children = buildArrayItemChildren(merged, path);
                        return { path, label: key, type: 'array', children, visible: true, extractPath: path, idx, arrayLength: val.length };
                    }
                    return { path, label: key, type: 'array-primitive', children: [], visible: true, extractPath: path, idx, arrayLength: val.length };
                }

                const children = buildObjectChildren(val, path);
                return { path, label: key, type: 'object', children, visible: true, extractPath: path, idx };
            });
        }

        function buildArrayItemChildren(obj, arrayPath) {
            return Object.keys(obj).map(key => {
                const val = obj[key];
                const bracketPath = `${arrayPath}[${key}]`;
                const idx = schemaNodeIndex++;

                if (val === null || val === undefined || typeof val !== 'object') {
                    return { path: bracketPath, label: key, type: 'primitive', children: [], visible: true, extractPath: key, idx };
                }

                if (Array.isArray(val)) {
                    const allObj = val.length > 0 && val.every(item => item !== null && typeof item === 'object' && !Array.isArray(item));
                    if (allObj) {
                        const merged = deepMergeObjects(val);
                        const children = buildArrayItemChildren(merged, bracketPath);
                        return { path: bracketPath, label: key, type: 'array', children, visible: true, extractPath: key, idx, arrayLength: val.length };
                    }
                    return { path: bracketPath, label: key, type: 'array-primitive', children: [], visible: true, extractPath: key, idx, arrayLength: val.length };
                }

                const children = buildObjectInArrayChildren(val, bracketPath, key);
                return { path: bracketPath, label: key, type: 'object', children, visible: true, extractPath: key, idx };
            });
        }

        function buildObjectInArrayChildren(obj, parentBracketPath, parentExtractPath) {
            return Object.keys(obj).map(key => {
                const val = obj[key];
                const path = `${parentBracketPath}.${key}`;
                const extractPath = `${parentExtractPath}.${key}`;
                const idx = schemaNodeIndex++;

                if (val === null || val === undefined || typeof val !== 'object') {
                    return { path, label: key, type: 'primitive', children: [], visible: true, extractPath, idx };
                }

                if (Array.isArray(val)) {
                    const allObj = val.length > 0 && val.every(item => item !== null && typeof item === 'object' && !Array.isArray(item));
                    if (allObj) {
                        const merged = deepMergeObjects(val);
                        const children = buildArrayItemChildren(merged, path);
                        return { path, label: key, type: 'array', children, visible: true, extractPath, idx, arrayLength: val.length };
                    }
                    return { path, label: key, type: 'array-primitive', children: [], visible: true, extractPath, idx, arrayLength: val.length };
                }

                const children = buildObjectInArrayChildren(val, path, extractPath);
                return { path, label: key, type: 'object', children, visible: true, extractPath, idx };
            });
        }

        // ===== Schema Utilities =====
        function getAllPaths(nodes) {
            const paths = [];
            for (const node of nodes) {
                paths.push(node.path);
                if (node.children.length > 0) paths.push(...getAllPaths(node.children));
            }
            return paths;
        }

        function getLeafNodes(nodes) {
            const leaves = [];
            for (const node of nodes) {
                if (!node.visible) continue;
                if (node.type === 'primitive' || node.type === 'array' || node.type === 'array-primitive') {
                    leaves.push(node);
                } else if (node.type === 'object') {
                    leaves.push(...getLeafNodes(node.children));
                }
            }
            return leaves;
        }

        function countVisibleLeaves(node) {
            if (!node.visible) return 0;
            if (node.type === 'primitive' || node.type === 'array' || node.type === 'array-primitive') return 1;
            if (node.type === 'object') return node.children.reduce((sum, c) => sum + countVisibleLeaves(c), 0);
            return 0;
        }

        function getMaxHeaderDepth(nodes) {
            let max = 1;
            for (const node of nodes) {
                if (!node.visible) continue;
                if (node.type === 'object' && node.children.some(c => c.visible)) {
                    max = Math.max(max, 1 + getMaxHeaderDepth(node.children));
                }
            }
            return max;
        }

        function updateSchemaVisibility(nodes) {
            for (const node of nodes) {
                node.visible = visiblePaths.has(node.path);
                if (node.children.length > 0) updateSchemaVisibility(node.children);
            }
        }

        function ensureParentVisibility(nodes) {
            for (const node of nodes) {
                if (node.children.length > 0) {
                    ensureParentVisibility(node.children);
                    const anyChildVisible = node.children.some(c => c.visible);
                    if (anyChildVisible && !node.visible) {
                        visiblePaths.add(node.path);
                        node.visible = true;
                    }
                    if (!anyChildVisible && node.visible) {
                        visiblePaths.delete(node.path);
                        node.visible = false;
                    }
                }
            }
        }

        function findNodeByPath(nodes, path) {
            for (const node of nodes) {
                if (node.path === path) return node;
                if (node.children.length > 0) {
                    const found = findNodeByPath(node.children, path);
                    if (found) return found;
                }
            }
            return null;
        }

        function findNodeByIdx(nodes, idx) {
            for (const node of nodes) {
                if (node.idx === idx) return node;
                if (node.children.length > 0) {
                    const found = findNodeByIdx(node.children, idx);
                    if (found) return found;
                }
            }
            return null;
        }

        // ===== Value Extraction =====
        function getValueByPath(obj, path) {
            if (!obj || !path) return undefined;
            const parts = path.split('.');
            let current = obj;
            for (const part of parts) {
                if (current === null || current === undefined) return undefined;
                current = current[part];
            }
            return current;
        }

        // ===== Table Rendering =====
        function renderView() {
            if (detectNested(jsonData)) {
                if (currentViewMode === 'horizontal') {
                    renderHorizontalNestedView();
                } else {
                    renderNestedView();
                }
            } else {
                renderUnifiedTable();
            }
            restoreExpandState();
            requestAnimationFrame(updateStickyHeaders);
        }

        // ===== View Mode Toggle =====
        function switchViewMode(mode) {
            currentViewMode = mode;
            updateViewModeToggleUI();
            if (jsonData.length > 0) {
                renderView();
            }
        }

        function updateViewModeToggleUI() {
            var btnH = document.getElementById('btnHorizontal');
            var btnV = document.getElementById('btnVertical');
            if (btnH) btnH.classList.toggle('active', currentViewMode === 'horizontal');
            if (btnV) btnV.classList.toggle('active', currentViewMode === 'vertical');
            updateViewToggleVisibility();
        }

        function updateViewToggleVisibility() {
            var toggle = document.getElementById('viewModeToggle');
            if (toggle) {
                toggle.style.display = (jsonData.length > 0 && detectNested(jsonData)) ? 'flex' : 'none';
            }
        }

        // ===== Nested View Rendering =====
        function renderNestedView() {
            const container = document.getElementById('tableContainer');
            const fullscreenContainer = document.getElementById('fullscreenTableContainer');

            if (!rawParsedData || columnSchema.length === 0) {
                const emptyHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无数据</div><div class="empty-hint">请在上方粘贴 JSON 数据并点击"解析数据"按钮</div></div>';
                container.innerHTML = emptyHTML;
                fullscreenContainer.innerHTML = emptyHTML;
                return;
            }

            const visibleSchema = columnSchema.filter(function(n) { return n.visible; });
            if (visibleSchema.length === 0) {
                const emptyHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">未选择任何列</div><div class="empty-hint">请在列设置中选择要显示的字段</div></div>';
                container.innerHTML = emptyHTML;
                fullscreenContainer.innerHTML = emptyHTML;
                return;
            }

            const html = jsonData.map(function(row, idx) { return renderRootRowCard(row, visibleSchema, idx); }).join('');
            container.innerHTML = html;
            fullscreenContainer.innerHTML = html;
        }

        // ===== Horizontal Nested View (referencing jsonview_row.html style) =====
        function renderHorizontalNestedView() {
            var container = document.getElementById('tableContainer');
            var fullscreenContainer = document.getElementById('fullscreenTableContainer');

            if (!rawParsedData || columnSchema.length === 0) {
                var emptyHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无数据</div><div class="empty-hint">请在上方粘贴 JSON 数据并点击"解析数据"按钮</div></div>';
                container.innerHTML = emptyHTML;
                fullscreenContainer.innerHTML = emptyHTML;
                return;
            }

            var visibleSchema = columnSchema.filter(function(n) { return n.visible; });
            if (visibleSchema.length === 0) {
                var emptyHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">未选择任何列</div><div class="empty-hint">请在列设置中选择要显示的字段</div></div>';
                container.innerHTML = emptyHTML;
                fullscreenContainer.innerHTML = emptyHTML;
                return;
            }

            var html = renderHArrayOfObjects(jsonData, visibleSchema, 0, 'h');
            container.innerHTML = html;
            fullscreenContainer.innerHTML = html;
        }

        function renderHArrayOfObjects(arr, schemaNodes, depth, ctx) {
            var ed = depth % 6;
            var cd = (depth + 1) % 6;

            var ths = schemaNodes.map(function(n) {
                var badge = getHSchemaBadge(n);
                return '<th>' + escapeHTML(n.label) + badge + '</th>';
            }).join('');

            var rows = arr.map(function(item, ri) {
                var tds = schemaNodes.map(function(n) {
                    var val = item != null ? item[n.label] : undefined;
                    var cellCtx = (ctx || 'h') + '_r' + ri + '_' + safeId(n.label);
                    return '<td>' + renderHCellValue(val, cellCtx, n, depth, cd) + '</td>';
                }).join('');
                return '<tr>' + tds + '</tr>';
            }).join('');

            return '<table class="arr-row-table nested-depth-' + ed + '">' +
                '<thead><tr>' + ths + '</tr></thead>' +
                '<tbody>' + rows + '</tbody></table>';
        }

        function getHSchemaBadge(node) {
            if (node.type === 'object') return ' <span class="th-badge th-badge-obj">{...}</span>';
            if (node.type === 'array') return ' <span class="th-badge th-badge-arr">[' + (node.arrayLength != null ? node.arrayLength : '') + ']</span>';
            if (node.type === 'array-primitive') return ' <span class="th-badge th-badge-arr">[' + (node.arrayLength != null ? node.arrayLength : '') + ']</span>';
            return '';
        }

        function renderHCellValue(val, ctx, schemaNode, depth, childDepth) {
            if (val === null || val === undefined || typeof val !== 'object') {
                return renderPrimitive(val);
            }

            var cid = ctx;
            var label, bodyHTML;

            if (Array.isArray(val)) {
                label = val.length + ' 项';
                var allObj = val.length > 0 && val.every(function(item) {
                    return item !== null && typeof item === 'object' && !Array.isArray(item);
                });
                if (allObj) {
                    if (schemaNode && schemaNode.type === 'array' && schemaNode.children.length > 0) {
                        var vc = schemaNode.children.filter(function(c) { return c.visible; });
                        bodyHTML = vc.length > 0
                            ? renderHArrayOfObjects(val, vc, depth + 1, ctx + '_arr')
                            : renderHArrayOfObjectsAuto(val, depth + 1, ctx + '_arr');
                    } else {
                        bodyHTML = renderHArrayOfObjectsAuto(val, depth + 1, ctx + '_arr');
                    }
                } else {
                    bodyHTML = renderHPrimitiveArrayNested(val, depth + 1, childDepth, ctx + '_parr');
                }
            } else {
                var keys = Object.keys(val);
                label = keys.length + ' 个属性';
                if (schemaNode && schemaNode.type === 'object' && schemaNode.children.length > 0) {
                    var vc2 = schemaNode.children.filter(function(c) { return c.visible; });
                    bodyHTML = vc2.length > 0
                        ? renderHSingleObject(val, vc2, depth + 1, ctx + '_obj')
                        : renderHSingleObjectAuto(val, depth + 1, ctx + '_obj');
                } else {
                    bodyHTML = renderHSingleObjectAuto(val, depth + 1, ctx + '_obj');
                }
            }

            return '<div class="cell-nested" onclick="toggleCollapse(event, \'' + cid + '\')">' +
                '<span class="cell-expand-btn" id="icon_' + cid + '">▶</span>' +
                '<span class="cell-expand-label">' + label + '</span></div>' +
            '<div class="cell-nested-body collapsed-content nested-depth-' + childDepth + '" id="content_' + cid + '">' + bodyHTML + '</div>';
        }

        function renderHSingleObject(obj, schemaNodes, depth, ctx) {
            var ed = depth % 6;
            var cd = (depth + 1) % 6;

            var ths = schemaNodes.map(function(n) {
                var badge = getHSchemaBadge(n);
                return '<th>' + escapeHTML(n.label) + badge + '</th>';
            }).join('');

            var tds = schemaNodes.map(function(n) {
                var val = obj != null ? obj[n.label] : undefined;
                var cellCtx = (ctx || 'hso') + '_' + safeId(n.label);
                return '<td>' + renderHCellValue(val, cellCtx, n, depth, cd) + '</td>';
            }).join('');

            return '<table class="arr-row-table nested-depth-' + ed + '">' +
                '<thead><tr>' + ths + '</tr></thead>' +
                '<tbody><tr>' + tds + '</tr></tbody></table>';
        }

        function renderHArrayOfObjectsAuto(arr, depth, ctx) {
            var ed = depth % 6;
            var cd = (depth + 1) % 6;
            var keySet = new Set();
            arr.forEach(function(item) {
                if (item && typeof item === 'object' && !Array.isArray(item)) {
                    Object.keys(item).forEach(function(k) { keySet.add(k); });
                }
            });
            var cols = Array.from(keySet);

            var ths = cols.map(function(col) {
                var sampleItem = arr.find(function(item) { return item[col] !== undefined; });
                var badge = '';
                if (sampleItem) {
                    var sv = sampleItem[col];
                    if (sv !== null && typeof sv === 'object') {
                        badge = Array.isArray(sv)
                            ? '<span class="th-badge th-badge-arr">[' + sv.length + ']</span>'
                            : '<span class="th-badge th-badge-obj">{' + Object.keys(sv).length + '}</span>';
                    }
                }
                return '<th>' + escapeHTML(col) + badge + '</th>';
            }).join('');

            var rows = arr.map(function(item, ri) {
                var tds = cols.map(function(col) {
                    var val = item[col];
                    if (val === undefined) return '<td style="color:var(--text-secondary);">—</td>';
                    if (val === null || typeof val !== 'object') return '<td>' + renderPrimitive(val) + '</td>';
                    var cellCtx = (ctx || 'haoa') + '_r' + ri + '_' + safeId(col);
                    return '<td>' + renderHCellValue(val, cellCtx, null, depth, cd) + '</td>';
                }).join('');
                return '<tr>' + tds + '</tr>';
            }).join('');

            return '<table class="arr-row-table nested-depth-' + ed + '">' +
                '<thead><tr>' + ths + '</tr></thead>' +
                '<tbody>' + rows + '</tbody></table>';
        }

        function renderHSingleObjectAuto(obj, depth, ctx) {
            var keys = Object.keys(obj);
            var ed = depth % 6;
            var cd = (depth + 1) % 6;

            var ths = keys.map(function(k) {
                var val = obj[k];
                var badge = '';
                if (val !== null && typeof val === 'object') {
                    badge = Array.isArray(val)
                        ? '<span class="th-badge th-badge-arr">[' + val.length + ']</span>'
                        : '<span class="th-badge th-badge-obj">{' + Object.keys(val).length + '}</span>';
                }
                return '<th>' + escapeHTML(k) + badge + '</th>';
            }).join('');

            var tds = keys.map(function(k) {
                var val = obj[k];
                var cellCtx = (ctx || 'hsoa') + '_' + safeId(k);
                return '<td>' + renderHCellValue(val, cellCtx, null, depth, cd) + '</td>';
            }).join('');

            return '<table class="arr-row-table nested-depth-' + ed + '">' +
                '<thead><tr>' + ths + '</tr></thead>' +
                '<tbody><tr>' + tds + '</tr></tbody></table>';
        }

        function renderHPrimitiveArrayNested(arr, depth, childDepth, ctx) {
            var ed = depth % 6;
            var rows = arr.map(function(item, idx) {
                var valHTML;
                if (item !== null && typeof item === 'object') {
                    if (Array.isArray(item)) {
                        var itemCtx = (ctx || 'hpan') + '_i' + idx;
                        valHTML = renderHCellValue(item, itemCtx, null, depth, childDepth);
                    } else {
                        valHTML = renderHSingleObjectAuto(item, depth + 1, (ctx || 'hpan') + '_i' + idx);
                    }
                } else {
                    valHTML = renderPrimitive(item);
                }
                return '<tr><td class="nested-key-cell" style="width:60px;text-align:center;"><span class="arr-row-index">#' + idx + '</span></td><td>' + valHTML + '</td></tr>';
            }).join('');
            return '<table class="nested-table nested-depth-' + ed + '"><tbody>' + rows + '</tbody></table>';
        }

        function renderRootRowCard(obj, schemaNodes, index) {
            var uid = 'v_r' + index;

            // Find a representative label for the card header
            var labelNode = schemaNodes.find(function(n) { return n.type === 'primitive' && n.visible; });
            var headerLabel = '#' + (index + 1);
            if (labelNode) {
                var v = obj != null ? obj[labelNode.label] : undefined;
                if (v !== undefined && v !== null) headerLabel = String(v);
            }

            var visibleNodes = schemaNodes.filter(function(n) { return n.visible; });
            var bodyRows = renderNestedKeyValues(obj, visibleNodes, 0, 'v_r' + index);

            return '<div class="root-row nested-depth-0">' +
                '<div class="root-row-header" onclick="toggleCollapse(event, \'' + uid + '\')">' +
                    '<span class="root-row-icon" id="icon_' + uid + '">▼</span>' +
                    '<span class="root-row-key">' + escapeHTML(headerLabel) + '</span>' +
                    '<span class="root-row-badge root-row-badge-obj">对象</span>' +
                    '<span class="root-row-summary">' + visibleNodes.length + ' 个字段</span>' +
                '</div>' +
                '<div class="root-row-body" id="content_' + uid + '">' +
                    '<div class="root-row-body-inner">' +
                        '<table class="nested-table nested-depth-0"><tbody>' + bodyRows + '</tbody></table>' +
                    '</div>' +
                '</div>' +
            '</div>';
        }

        function renderNestedKeyValues(obj, nodes, depth, ctx) {
            if (!obj || typeof obj !== 'object') return '';

            return nodes.map(function(node) {
                var val = obj != null ? obj[node.label] : undefined;
                var childDepth = (depth + 1) % 6;
                var nodeCtx = (ctx || 'v') + '_' + safeId(node.label);

                if (node.type === 'primitive') {
                    return '<tr><td class="nested-key">' + escapeHTML(node.label) + '</td>' +
                        '<td class="nested-value">' + renderPrimitive(val) + '</td></tr>';
                }

                if (node.type === 'object') {
                    var visibleChildren = node.children.filter(function(c) { return c.visible; });
                    if (visibleChildren.length === 0) return '';

                    var uid = nodeCtx;
                    var childRows = renderNestedKeyValues(val || {}, visibleChildren, depth + 1, nodeCtx);
                    var subTable = '<div class="nested-subtable-wrap nested-depth-' + childDepth + '">' +
                        '<table class="nested-table nested-depth-' + childDepth + '"><tbody>' + childRows + '</tbody></table></div>';

                    return '<tr><td class="nested-key">' + escapeHTML(node.label) + ' <span class="key-badge badge-obj">{...}</span></td>' +
                        '<td class="nested-value">' +
                            '<div class="collapse-toggle" onclick="toggleCollapse(event, \'' + uid + '\')">' +
                                '<span class="collapse-icon collapsed" id="icon_' + uid + '">▼</span>' +
                                '<span style="font-size:12px;color:var(--text-secondary)">' + visibleChildren.length + ' 个字段</span>' +
                            '</div>' +
                            '<div id="content_' + uid + '" class="collapsed-content">' + subTable + '</div>' +
                        '</td></tr>';
                }

                if (node.type === 'array') {
                    var arr = val;
                    var count = arr ? arr.length : 0;
                    var visibleChildren2 = node.children.filter(function(c) { return c.visible; });
                    var uid2 = nodeCtx;
                    var arrContent = '';
                    if (arr && arr.length > 0 && visibleChildren2.length > 0) {
                        arrContent = renderNestedArrayItems(arr, visibleChildren2, childDepth, nodeCtx);
                    } else if (count === 0) {
                        arrContent = '<span class="primitive-value null-value">[]</span>';
                    } else {
                        arrContent = '<span style="font-size:12px;color:var(--text-secondary)">无可显示字段</span>';
                    }

                    return '<tr><td class="nested-key">' + escapeHTML(node.label) + ' <span class="key-badge badge-arr">[' + count + ']</span></td>' +
                        '<td class="nested-value">' +
                            '<div class="collapse-toggle" onclick="toggleCollapse(event, \'' + uid2 + '\')">' +
                                '<span class="collapse-icon collapsed" id="icon_' + uid2 + '">▼</span>' +
                                '<span style="font-size:12px;color:var(--text-secondary)">' + count + ' 项</span>' +
                            '</div>' +
                            '<div id="content_' + uid2 + '" class="collapsed-content">' + arrContent + '</div>' +
                        '</td></tr>';
                }

                if (node.type === 'array-primitive') {
                    var arr2 = val;
                    var count2 = arr2 ? arr2.length : 0;
                    var uid3 = nodeCtx;
                    var arrContent2 = '';
                    if (arr2 && arr2.length > 0) {
                        arrContent2 = '<div class="nested-subtable-wrap nested-depth-' + childDepth + '">' +
                            '<table class="nested-table nested-depth-' + childDepth + '"><tbody>' +
                            arr2.map(function(item, idx) {
                                return '<tr><td class="nested-key" style="width:60px;text-align:center"><span class="array-index">#' + idx + '</span></td>' +
                                    '<td class="nested-value">' + renderPrimitive(item) + '</td></tr>';
                            }).join('') +
                            '</tbody></table></div>';
                    } else {
                        arrContent2 = '<span class="primitive-value null-value">[]</span>';
                    }

                    return '<tr><td class="nested-key">' + escapeHTML(node.label) + ' <span class="key-badge badge-arr">[' + count2 + ']</span></td>' +
                        '<td class="nested-value">' +
                            '<div class="collapse-toggle" onclick="toggleCollapse(event, \'' + uid3 + '\')">' +
                                '<span class="collapse-icon collapsed" id="icon_' + uid3 + '">▼</span>' +
                                '<span style="font-size:12px;color:var(--text-secondary)">' + count2 + ' 项</span>' +
                            '</div>' +
                            '<div id="content_' + uid3 + '" class="collapsed-content">' + arrContent2 + '</div>' +
                        '</td></tr>';
                }

                return '';
            }).join('');
        }

        function renderNestedArrayItems(arr, visibleChildren, depth, ctx) {
            var depthClass = 'nested-depth-' + (depth % 6);

            return arr.map(function(item, idx) {
                var uid = (ctx || 'vai') + '_i' + idx;

                // Find a representative label for the array item
                var labelNode = visibleChildren.find(function(n) { return n.type === 'primitive'; });
                var headerLabel = '#' + (idx + 1);
                if (labelNode && item) {
                    var v = item != null ? item[labelNode.label] : undefined;
                    if (v !== undefined && v !== null) headerLabel = String(v);
                }

                var bodyRows = renderNestedKeyValues(item, visibleChildren, depth, uid);

                return '<div class="root-row ' + depthClass + '">' +
                    '<div class="root-row-header" onclick="toggleCollapse(event, \'' + uid + '\')">' +
                        '<span class="root-row-icon" id="icon_' + uid + '">▼</span>' +
                        '<span class="root-row-key">' + escapeHTML(headerLabel) + '</span>' +
                        '<span class="root-row-badge root-row-badge-arr">数组项</span>' +
                        '<span class="root-row-summary">' + visibleChildren.length + ' 个字段</span>' +
                    '</div>' +
                    '<div class="root-row-body" id="content_' + uid + '">' +
                        '<div class="root-row-body-inner">' +
                            '<table class="nested-table ' + depthClass + '"><tbody>' + bodyRows + '</tbody></table>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function renderUnifiedTable() {
            const container = document.getElementById('tableContainer');
            const fullscreenContainer = document.getElementById('fullscreenTableContainer');

            if (!rawParsedData || columnSchema.length === 0) {
                const emptyHTML = `<div class="empty-state">
                    <div class="empty-icon">📋</div>
                    <div class="empty-text">暂无数据</div>
                    <div class="empty-hint">请在上方粘贴 JSON 数据并点击"解析数据"按钮</div>
                </div>`;
                container.innerHTML = emptyHTML;
                fullscreenContainer.innerHTML = emptyHTML;
                return;
            }

            const visibleSchema = columnSchema.filter(n => n.visible);
            const leafNodes = getLeafNodes(visibleSchema);

            if (leafNodes.length === 0) {
                const emptyHTML = `<div class="empty-state">
                    <div class="empty-icon">🔍</div>
                    <div class="empty-text">未选择任何列</div>
                    <div class="empty-hint">请在列设置中选择要显示的字段</div>
                </div>`;
                container.innerHTML = emptyHTML;
                fullscreenContainer.innerHTML = emptyHTML;
                return;
            }

            const maxDepth = getMaxHeaderDepth(visibleSchema);

            // Build header rows
            const headerRows = [];
            for (let d = 0; d < maxDepth; d++) headerRows.push([]);
            buildHeaderCells(visibleSchema, 0, maxDepth, headerRows);

            // Render thead
            const theadHTML = headerRows.map(row => {
                const cells = row.map(cell => {
                    let attrs = '';
                    if (cell.colspan > 1) attrs += ` colspan="${cell.colspan}"`;
                    if (cell.rowspan > 1) attrs += ` rowspan="${cell.rowspan}"`;
                    let badge = '';
                    let cls = '';
                    if (cell.nodeType === 'array' || cell.nodeType === 'array-primitive') {
                        badge = ' <span class="th-badge th-badge-arr">[' + (cell.arrayLength != null ? cell.arrayLength : '') + ']</span>';
                        cls = ' class="array-header"';
                    } else if (cell.nodeType === 'group') {
                        cls = ' class="group-header"';
                    }
                    return `<th${attrs}${cls}>${escapeHTML(cell.label)}${badge}</th>`;
                }).join('');
                return `<tr>${cells}</tr>`;
            }).join('');

            // Render tbody
            const tbodyHTML = jsonData.map(row => {
                const cells = leafNodes.map(node => {
                    const val = getValueByPath(row, node.extractPath);
                    if (node.type === 'array') {
                        return `<td>${renderArrayCell(val, node, 0)}</td>`;
                    }
                    if (node.type === 'array-primitive') {
                        return `<td>${renderPrimitiveArrayCell(val, 0)}</td>`;
                    }
                    return `<td>${formatValue(val)}</td>`;
                }).join('');
                return `<tr>${cells}</tr>`;
            }).join('');

            const tableHTML = `<table class="data-table"><thead>${theadHTML}</thead><tbody>${tbodyHTML}</tbody></table>`;
            container.innerHTML = tableHTML;
            fullscreenContainer.innerHTML = tableHTML;
        }

        function buildHeaderCells(nodes, depth, maxDepth, rows) {
            for (const node of nodes) {
                if (!node.visible) continue;

                if (node.type === 'object' && node.children.some(c => c.visible)) {
                    const vl = countVisibleLeaves(node);
                    if (vl > 0) {
                        rows[depth].push({ label: node.label, colspan: vl, rowspan: 1, nodeType: 'group' });
                        buildHeaderCells(node.children, depth + 1, maxDepth, rows);
                    }
                } else if (node.type === 'array' || node.type === 'array-primitive') {
                    rows[depth].push({ label: node.label, colspan: 1, rowspan: maxDepth - depth, nodeType: node.type, arrayLength: node.arrayLength });
                } else {
                    rows[depth].push({ label: node.label, colspan: 1, rowspan: maxDepth - depth, nodeType: 'primitive' });
                }
            }
        }

        function renderArrayCell(arr, schemaNode, depth) {
            if (!arr || !Array.isArray(arr)) return formatValue(arr);
            if (arr.length === 0) return '<span class="primitive-value null-value">[]</span>';

            const uid = 'ac_' + Math.random().toString(36).substr(2, 8);
            const label = `${arr.length} 项`;
            const childDepth = (depth + 1) % 6;

            const visibleChildren = schemaNode.children.filter(c => c.visible);

            if (visibleChildren.length === 0) {
                return `<div class="cell-nested" onclick="toggleCollapse(event, '${uid}')">
                    <span class="cell-expand-btn" id="icon_${uid}">▶</span>
                    <span class="cell-expand-label">${label}</span>
                </div>
                <div class="cell-nested-body collapsed-content nested-depth-${childDepth}" id="content_${uid}">
                    <div style="padding: 12px; color: var(--text-secondary); font-size: 12px;">未选择可见列，请在列设置中开启</div>
                </div>`;
            }

            const childLeaves = getLeafNodes(visibleChildren);
            const maxSubDepth = getMaxHeaderDepth(visibleChildren);

            // Build sub-table headers
            const subHeaderRows = [];
            for (let d = 0; d < maxSubDepth; d++) subHeaderRows.push([]);
            buildHeaderCells(visibleChildren, 0, maxSubDepth, subHeaderRows);

            const theadHTML = subHeaderRows.map(row => {
                const cells = row.map(cell => {
                    let attrs = '';
                    if (cell.colspan > 1) attrs += ` colspan="${cell.colspan}"`;
                    if (cell.rowspan > 1) attrs += ` rowspan="${cell.rowspan}"`;
                    let badge = '';
                    if (cell.nodeType === 'array' || cell.nodeType === 'array-primitive') {
                        badge = ' <span class="th-badge th-badge-arr">[' + (cell.arrayLength != null ? cell.arrayLength : '') + ']</span>';
                    }
                    return `<th${attrs}>${escapeHTML(cell.label)}${badge}</th>`;
                }).join('');
                return `<tr>${cells}</tr>`;
            }).join('');

            const tbodyHTML = arr.map(item => {
                const cells = childLeaves.map(leaf => {
                    const val = getValueByPath(item, leaf.extractPath);
                    if (leaf.type === 'array') {
                        return `<td>${renderArrayCell(val, leaf, depth + 1)}</td>`;
                    }
                    if (leaf.type === 'array-primitive') {
                        return `<td>${renderPrimitiveArrayCell(val, depth + 1)}</td>`;
                    }
                    return `<td>${formatValue(val)}</td>`;
                }).join('');
                return `<tr>${cells}</tr>`;
            }).join('');

            const bodyHTML = `<table class="arr-row-table nested-depth-${childDepth}"><thead>${theadHTML}</thead><tbody>${tbodyHTML}</tbody></table>`;

            return `<div class="cell-nested" onclick="toggleCollapse(event, '${uid}')">
                <span class="cell-expand-btn" id="icon_${uid}">▶</span>
                <span class="cell-expand-label">${label}</span>
            </div>
            <div class="cell-nested-body collapsed-content nested-depth-${childDepth}" id="content_${uid}">${bodyHTML}</div>`;
        }

        function renderPrimitiveArrayCell(arr, depth) {
            if (!arr || !Array.isArray(arr)) return formatValue(arr);
            if (arr.length === 0) return '<span class="primitive-value null-value">[]</span>';

            const uid = 'pac_' + Math.random().toString(36).substr(2, 8);
            const label = `${arr.length} 项`;
            const childDepth = (depth + 1) % 6;

            const bodyHTML = `<table class="nested-table nested-depth-${childDepth}"><tbody>${arr.map((item, idx) =>
                `<tr><td class="nested-key-cell" style="width:60px;text-align:center;"><span class="arr-row-index">#${idx}</span></td><td>${renderPrimitive(item)}</td></tr>`
            ).join('')}</tbody></table>`;

            return `<div class="cell-nested" onclick="toggleCollapse(event, '${uid}')">
                <span class="cell-expand-btn" id="icon_${uid}">▶</span>
                <span class="cell-expand-label">${label}</span>
            </div>
            <div class="cell-nested-body collapsed-content nested-depth-${childDepth}" id="content_${uid}">${bodyHTML}</div>`;
        }

        function updateStickyHeaders() {
            document.querySelectorAll('.data-table').forEach(table => {
                const headerRows = table.querySelectorAll('thead tr');
                let cumHeight = 0;
                headerRows.forEach((row) => {
                    const ths = row.querySelectorAll('th');
                    const rowHeight = row.getBoundingClientRect().height;
                    if (rowHeight > 0) {
                        ths.forEach(th => { th.style.top = cumHeight + 'px'; });
                        cumHeight += rowHeight;
                    }
                });
            });
        }

        // ===== Column Settings =====
        function renderTreeColumnSettings() {
            const html = renderFlatColumnNodes(columnSchema);
            document.getElementById('columnList').innerHTML = html;
            document.getElementById('columnListFullscreen').innerHTML = html;
        }

        function renderFlatColumnNodes(nodes) {
            const flatItems = flattenSchemaNodes(nodes);
            return flatItems.map(item => {
                const checked = item.visible ? 'checked' : '';
                let typeHint = '';
                if (item.type === 'object') typeHint = '<span class="col-type-hint">{...}</span>';
                else if (item.type === 'array') typeHint = '<span class="col-type-hint">[...]</span>';
                else if (item.type === 'array-primitive') typeHint = '<span class="col-type-hint">[]</span>';

                return `<div class="column-tree-item" style="padding-left: 8px;">
                    <input type="checkbox" data-idx="${item.idx}" ${checked} onchange="togglePathVisibility(${item.idx})">
                    <label onclick="this.previousElementSibling.click()" title="${escapeHTML(item.path)}">${escapeHTML(item.path)} ${typeHint}</label>
                </div>`;
            }).join('');
        }

        function flattenSchemaNodes(nodes) {
            const result = [];
            for (const node of nodes) {
                result.push(node);
                if (node.children.length > 0) {
                    result.push(...flattenSchemaNodes(node.children));
                }
            }
            return result;
        }

        function togglePathVisibility(idx) {
            const node = findNodeByIdx(columnSchema, idx);
            if (!node) return;

            const newVisible = !node.visible;
            const descendantPaths = getAllPaths([node]);

            if (newVisible) {
                descendantPaths.forEach(p => visiblePaths.add(p));
            } else {
                descendantPaths.forEach(p => visiblePaths.delete(p));
            }

            updateSchemaVisibility(columnSchema);
            ensureParentVisibility(columnSchema);

            renderTreeColumnSettings();
            renderView();
        }

        function updateParentCheckboxStates() {
            function process(nodes) {
                for (const node of nodes) {
                    if (node.children.length > 0) {
                        process(node.children);
                        const visibleChildren = node.children.filter(c => c.visible).length;
                        const totalChildren = node.children.length;
                        const indeterminate = visibleChildren > 0 && visibleChildren < totalChildren;
                        document.querySelectorAll(`input[data-idx="${node.idx}"]`).forEach(cb => {
                            cb.indeterminate = indeterminate;
                        });
                    }
                }
            }
            process(columnSchema);
        }

        function toggleDropdown() {
            document.getElementById('columnDropdown').classList.toggle('show');
        }

        function toggleDropdownFullscreen() {
            document.getElementById('columnDropdownFullscreen').classList.toggle('show');
        }

        function selectAllColumns() {
            visiblePaths = new Set(getAllPaths(columnSchema));
            updateSchemaVisibility(columnSchema);
            renderTreeColumnSettings();
            renderView();
        }

        function deselectAllColumns() {
            visiblePaths = new Set();
            updateSchemaVisibility(columnSchema);
            renderTreeColumnSettings();
            renderView();
        }

        function selectAllColumnsFullscreen() { selectAllColumns(); }
        function deselectAllColumnsFullscreen() { deselectAllColumns(); }

        function refreshColumns() {
            visiblePaths = new Set(defaultPaths);
            updateSchemaVisibility(columnSchema);
            ensureParentVisibility(columnSchema);
            renderTreeColumnSettings();
            renderView();
        }

        function refreshColumnsFullscreen() { refreshColumns(); }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown')) {
                document.getElementById('columnDropdown').classList.remove('show');
                document.getElementById('columnDropdownFullscreen').classList.remove('show');
            }
        });

        // ===== Utility Functions =====
        function formatValue(value) {
            if (value === null || value === undefined) return '';
            if (typeof value === 'object') return JSON.stringify(value);
            return String(value);
        }

        function renderPrimitive(val) {
            if (val === null) return '<span class="primitive-value null-value">null</span>';
            if (val === undefined) return '<span class="primitive-value null-value">undefined</span>';
            if (typeof val === 'boolean') return `<span class="primitive-value bool-value">${val}</span>`;
            if (typeof val === 'number') return `<span class="primitive-value number-value">${val}</span>`;
            return `<span class="primitive-value string-value">${escapeHTML(String(val))}</span>`;
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function toggleCollapse(eventOrId, maybeId) {
            let id;
            if (typeof eventOrId === 'object' && eventOrId !== null) {
                eventOrId.stopPropagation();
                id = maybeId;
            } else {
                id = eventOrId;
            }
            const content = document.getElementById('content_' + id);
            const icon = document.getElementById('icon_' + id);
            if (content) {
                const isCollapsed = content.classList.toggle('collapsed-content');
                if (icon) {
                    if (isCollapsed) {
                        icon.classList.add('collapsed');
                    } else {
                        icon.classList.remove('collapsed');
                    }
                }
                if (isCollapsed) {
                    expandOverrides.set(id, false);
                } else {
                    expandOverrides.set(id, true);
                }
            }
        }

        function detectNested(data) {
            if (Array.isArray(data)) {
                return data.some(item => item !== null && typeof item === 'object' && detectNested(item));
            }
            if (typeof data === 'object' && data !== null) {
                return Object.values(data).some(val => val !== null && typeof val === 'object');
            }
            return false;
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('inputMessage');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
        }

        function clearInput() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('defaultFields').value = '';
            document.getElementById('tableTitle').value = '';
            document.getElementById('inputMessage').style.display = 'none';
            document.getElementById('dataCount').textContent = '';
            document.getElementById('dataCountFullscreen').textContent = '';
            updateViewToggleVisibility();
        }

        function formatJSON() {
            const input = document.getElementById('jsonInput').value.trim();
            if (!input) { showMessage('请输入 JSON 数据', 'error'); return; }
            try {
                const parsed = JSON.parse(input);
                document.getElementById('jsonInput').value = JSON.stringify(parsed, null, 2);
                showMessage('JSON 格式化成功', 'success');
                setTimeout(() => { document.getElementById('inputMessage').style.display = 'none'; }, 2000);
            } catch (error) {
                showMessage(`格式化失败: ${error.message}`, 'error');
            }
        }

        function compressJSON() {
            const input = document.getElementById('jsonInput').value.trim();
            if (!input) { showMessage('请输入 JSON 数据', 'error'); return; }
            try {
                const parsed = JSON.parse(input);
                document.getElementById('jsonInput').value = JSON.stringify(parsed);
                showMessage('JSON 压缩成功', 'success');
                setTimeout(() => { document.getElementById('inputMessage').style.display = 'none'; }, 2000);
            } catch (error) {
                showMessage(`压缩失败: ${error.message}`, 'error');
            }
        }

        // ===== Export =====
        function exportToExcel() {
            const leafNodes = getLeafNodes(columnSchema.filter(n => n.visible));
            if (leafNodes.length === 0 || jsonData.length === 0) {
                alert('没有可导出的数据');
                return;
            }

            const exportData = jsonData.map(row => {
                const obj = {};
                leafNodes.forEach(node => {
                    const val = getValueByPath(row, node.extractPath);
                    if (node.type === 'array' || node.type === 'array-primitive') {
                        obj[node.path] = val ? JSON.stringify(val) : '';
                    } else {
                        obj[node.path] = formatValue(val);
                    }
                });
                return obj;
            });

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '数据');

            const colWidths = leafNodes.map(node => ({
                wch: Math.max(node.path.length, ...exportData.map(row => String(row[node.path] || '').length))
            }));
            ws['!cols'] = colWidths;

            const tableTitle = document.getElementById('tableHeaderTitle').textContent;
            XLSX.writeFile(wb, `${tableTitle}.xlsx`);
        }

        // ===== Fullscreen =====
        function toggleFullscreen() {
            document.getElementById('fullscreenContainer').classList.add('active');
            requestAnimationFrame(updateStickyHeaders);
        }

        function closeFullscreen() {
            document.getElementById('fullscreenContainer').classList.remove('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeFullscreen();
        });

        window.addEventListener('resize', updateStickyHeaders);
    </script>
</body>
</html>
