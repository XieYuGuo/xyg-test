<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 表格可视化工具</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23667eea'/%3E%3Cstop offset='100%25' stop-color='%23764ba2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Crect x='6' y='8' width='20' height='4' rx='1' fill='white' opacity='0.9'/%3E%3Crect x='6' y='14' width='20' height='4' rx='1' fill='white' opacity='0.7'/%3E%3Crect x='6' y='20' width='20' height='4' rx='1' fill='white' opacity='0.5'/%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-primary: #f5f7fa;
            --bg-card: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --border-color: #e4e7ed;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-color: #667eea;
            --primary-hover: #5568d3;
            --success-color: #67c23a;
            --danger-color: #f56c6c;
        }
        
        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-card: #16213e;
            --text-primary: #eaeaea;
            --text-secondary: #a0a0a0;
            --border-color: #2a2a4a;
            --shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        [data-theme="dark"] ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        
        [data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: #3a3a5a;
        }
        
        [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
            background: #4a4a6a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 16px 24px;
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--primary-gradient);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .btn-secondary:hover {
            background: var(--border-color);
        }
        
        .btn-success {
            background: var(--success-color);
            color: white;
        }
        
        .btn-success:hover {
            opacity: 0.9;
        }
        
        /* Input Section */
        .input-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        
        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .input-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .input-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .json-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .json-actions {
            display: flex;
            gap: 8px;
        }
        
        .json-textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.3s;
        }
        
        .json-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .control-item {
            width: 100%;
        }
        
        .control-item label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        
        .control-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.3s;
        }
        
        .control-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .control-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
        }
        
        .hint-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        /* Table Section */
        .table-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            flex: 1;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            overflow: visible;
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .table-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .data-count {
            display: inline-block;
            background: var(--primary-gradient);
            color: white;
            font-size: 12px;
            font-weight: 500;
            padding: 2px 10px;
            border-radius: 10px;
            margin-left: 8px;
            vertical-align: middle;
        }
        
        .table-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        /* Column Settings Dropdown */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 8px;
            background: var(--bg-card);
            min-width: 380px;
            max-height: 500px;
            overflow-y: auto;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            z-index: 1000;
            padding: 12px;
        }
        
        .dropdown-content.show {
            display: block;
        }
        
        .dropdown-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        
        .column-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .column-item:hover {
            background: var(--bg-primary);
        }
        
        .column-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }
        
        .column-item label {
            flex: 1;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-primary);
        }
        
        .dropdown-footer {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        
        /* Table Container */
        .table-container {
            flex: 1;
            min-height: 300px;
            overflow: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .data-table th {
            background: var(--bg-primary);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        
        .data-table tr:hover {
            background: var(--bg-primary);
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .empty-text {
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .empty-hint {
            font-size: 13px;
            opacity: 0.7;
        }
        
        /* Fullscreen */
        .fullscreen-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            z-index: 9999;
            padding: 20px;
            display: none;
            flex-direction: column;
        }
        
        .fullscreen-container.active {
            display: flex;
        }
        
        .fullscreen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 16px 24px;
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }
        
        .fullscreen-content {
            flex: 1;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .fullscreen-table-container {
            flex: 1;
            overflow: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        
        /* Message */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 13px;
            display: none;
        }
        
        .message.error {
            background: #fef0f0;
            color: var(--danger-color);
            border: 1px solid #fde2e2;
            display: block;
        }
        
        .message.success {
            background: #f0f9ff;
            color: var(--primary-color);
            border: 1px solid #d9ecff;
            display: block;
        }
        
        /* Nested Table Styles */
        .nested-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
            border-radius: 6px;
            overflow: hidden;
        }

        .nested-table th {
            background: var(--bg-primary);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
            white-space: nowrap;
        }

        .nested-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
            color: var(--text-primary);
            word-break: break-word;
        }

        .nested-table tbody tr:hover {
            background: var(--bg-primary);
        }

        .nested-table tr:last-child td {
            border-bottom: none;
        }

        .nested-key {
            font-weight: 600;
            white-space: nowrap;
            min-width: 120px;
            max-width: 220px;
            width: 25%;
            color: var(--text-primary);
            background: var(--bg-primary);
        }

        .nested-key .key-badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            margin-left: 6px;
            vertical-align: middle;
        }

        .nested-key .badge-obj {
            background: rgba(102, 126, 234, 0.15);
            color: var(--primary-color);
        }

        .nested-key .badge-arr {
            background: rgba(103, 194, 58, 0.15);
            color: var(--success-color);
        }

        .nested-value {
            word-break: break-word;
        }

        .nested-value .primitive-value {
            font-family: 'Courier New', monospace;
        }

        .nested-value .null-value {
            color: var(--text-secondary);
            font-style: italic;
        }

        .nested-value .bool-value {
            color: #e6a23c;
            font-weight: 500;
        }

        .nested-value .number-value {
            color: #f56c6c;
        }

        .nested-value .string-value {
            color: var(--text-primary);
        }

        /* Global primitive value styles (works in arr-row-table td too) */
        .primitive-value {
            font-family: 'Courier New', monospace;
        }

        .primitive-value.null-value {
            color: var(--text-secondary);
            font-style: italic;
        }

        .primitive-value.bool-value {
            color: #e6a23c;
            font-weight: 500;
        }

        .primitive-value.number-value {
            color: #f56c6c;
        }

        .primitive-value.string-value {
            color: var(--text-primary);
        }

        .nested-subtable-wrap {
            margin: 4px 0;
            border-radius: 8px;
            overflow: hidden;
        }

        .nested-depth-0 { border: 1px solid #e4e7ed; background: transparent; }
        .nested-depth-1 { border: 1px solid rgba(102, 126, 234, 0.25); background: rgba(102, 126, 234, 0.03); }
        .nested-depth-2 { border: 1px solid rgba(118, 75, 162, 0.25); background: rgba(118, 75, 162, 0.03); }
        .nested-depth-3 { border: 1px solid rgba(103, 194, 58, 0.25); background: rgba(103, 194, 58, 0.03); }
        .nested-depth-4 { border: 1px solid rgba(230, 162, 60, 0.25); background: rgba(230, 162, 60, 0.03); }
        .nested-depth-5 { border: 1px solid rgba(245, 108, 108, 0.25); background: rgba(245, 108, 108, 0.03); }

        [data-theme="dark"] .nested-depth-0 { border-color: #2a2a4a; background: transparent; }
        [data-theme="dark"] .nested-depth-1 { border-color: rgba(102, 126, 234, 0.35); background: rgba(102, 126, 234, 0.06); }
        [data-theme="dark"] .nested-depth-2 { border-color: rgba(118, 75, 162, 0.35); background: rgba(118, 75, 162, 0.06); }
        [data-theme="dark"] .nested-depth-3 { border-color: rgba(103, 194, 58, 0.35); background: rgba(103, 194, 58, 0.06); }
        [data-theme="dark"] .nested-depth-4 { border-color: rgba(230, 162, 60, 0.35); background: rgba(230, 162, 60, 0.06); }
        [data-theme="dark"] .nested-depth-5 { border-color: rgba(245, 108, 108, 0.35); background: rgba(245, 108, 108, 0.06); }

        .nested-table .nested-key-cell {
            background: rgba(102, 126, 234, 0.04);
        }

        [data-theme="dark"] .nested-table .nested-key-cell {
            background: rgba(102, 126, 234, 0.08);
        }

        /* Array Row Table (matches .data-table style) */
        .arr-row-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
            border-radius: 6px;
            overflow: hidden;
        }

        .arr-row-table th {
            background: var(--bg-primary);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
            white-space: nowrap;
        }

        .arr-row-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            vertical-align: top;
            word-break: break-word;
        }

        .arr-row-table tbody tr:hover {
            background: var(--bg-primary);
        }

        .arr-row-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* th badge */
        .th-badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            margin-left: 6px;
            vertical-align: middle;
        }

        .th-badge-obj {
            background: rgba(102, 126, 234, 0.15);
            color: var(--primary-color);
        }

        .th-badge-arr {
            background: rgba(103, 194, 58, 0.15);
            color: var(--success-color);
        }

        /* Array row index */
        .arr-row-index {
            display: inline-block;
            background: rgba(103, 194, 58, 0.15);
            color: var(--success-color);
            padding: 0 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
        }

        .array-index {
            display: inline-block;
            background: rgba(103, 194, 58, 0.15);
            color: var(--success-color);
            padding: 0 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 4px;
        }

        .view-toggle {
            display: flex;
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }

        .view-toggle-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            background: transparent;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .view-toggle-btn.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .view-toggle-btn:not(.active):hover {
            color: var(--text-primary);
            background: var(--border-color);
        }

        .collapse-toggle {
            cursor: pointer;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .collapse-toggle:hover {
            opacity: 0.8;
        }

        .collapse-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            line-height: 16px;
            text-align: center;
            border-radius: 3px;
            background: rgba(102, 126, 234, 0.12);
            color: var(--primary-color);
            font-size: 10px;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .collapse-icon.collapsed {
            transform: rotate(-90deg);
        }

        .collapsed-content {
            display: none;
        }

        /* Root Row Card */
        .root-row {
            margin-bottom: 12px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: box-shadow 0.2s;
        }

        .root-row:last-child {
            margin-bottom: 0;
        }

        .root-row:hover {
            box-shadow: 0 2px 12px rgba(102, 126, 234, 0.12);
        }

        .root-row-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(102, 126, 234, 0.06);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .root-row-header:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        [data-theme="dark"] .root-row-header {
            background: rgba(102, 126, 234, 0.1);
        }

        [data-theme="dark"] .root-row-header:hover {
            background: rgba(102, 126, 234, 0.16);
        }

        .root-row-key {
            font-weight: 600;
            font-size: 14px;
            color: var(--primary-color);
        }

        .root-row-badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .root-row-badge-obj {
            background: rgba(102, 126, 234, 0.15);
            color: var(--primary-color);
        }

        .root-row-badge-arr {
            background: rgba(103, 194, 58, 0.15);
            color: var(--success-color);
        }

        .root-row-primitive {
            font-size: 13px;
            padding: 10px 16px;
        }

        .root-row-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            line-height: 18px;
            text-align: center;
            border-radius: 4px;
            background: rgba(102, 126, 234, 0.12);
            color: var(--primary-color);
            font-size: 11px;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .root-row-icon.collapsed {
            transform: rotate(-90deg);
        }

        .root-row-summary {
            font-size: 12px;
            color: var(--text-secondary);
            margin-left: auto;
        }

        .root-row-body {
            padding: 0;
        }

        .root-row-body.collapsed-content {
            display: none;
        }

        .root-row-body-inner {
            padding: 8px;
        }

        /* Cell expandable nested value */
        .cell-nested {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            user-select: none;
            padding: 3px 8px;

        .cell-nested:hover {

        [data-theme="dark"] .cell-nested:hover {

        /* Responsive */

</head>

                </div>
